services:
   snapotter:
      image: snapotter/snapotter:latest
      container_name: snapotter
      restart: unless-stopped
      env_file:
         - .env
      environment:
         AUTH_ENABLED: "true"
         DEFAULT_USERNAME: ${DEFAULT_USERNAME:-admin}
         DEFAULT_PASSWORD: ${DEFAULT_PASSWORD}
         DATABASE_URL: postgres://snapotter:${SNAPOTTER_DB_PASSWORD}@postgres-main:5432/snapotter
         # DB 2 : WordPress = 0, Nextcloud = 1
         REDIS_URL: redis://redis-cache:6379/2
         TRUST_PROXY: loopback,linklocal,uniquelocal
         CONCURRENT_JOBS: ${CONCURRENT_JOBS:-2}
         MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-200}
      volumes:
         - snapotter-data:/data
         - snapotter-workspace:/tmp/workspace
      networks:
         - web-network
      cpus: 1.0
      mem_limit: 1536m
      shm_size: 512m
      security_opt:
         - no-new-privileges:true
      healthcheck:
         test: ["CMD", "curl", "-sf", "--max-time", "5", "http://localhost:1349/api/v1/health"]
         interval: 30s
         timeout: 5s
         start_period: 60s
         retries: 3
      logging:
         driver: json-file
         options:
            max-size: "10m"
            max-file: "3"

volumes:
   snapotter-data:
   snapotter-workspace:

networks:
   web-network:
      external: true
