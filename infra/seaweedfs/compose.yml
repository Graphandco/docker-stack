services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.53 
    container_name: seaweedfs
    restart: unless-stopped
    command: 'server -dir=/data -s3 -s3.port=8336 -filer -volume.max=0'
    volumes:
      - ./data:/data
    networks:
      - web-network

networks:
  web-network:
    external: true
